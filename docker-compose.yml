name: asistente-citas

services:
  postgres:
    image: postgres:16-alpine
    container_name: asistente-citas-postgres
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-citas_medicas}
      TZ: ${DEFAULT_TIMEZONE:-America/Caracas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-citas_medicas}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: asistente-citas-redis
    restart: unless-stopped
    stop_grace_period: 3s
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    environment:
      TZ: ${DEFAULT_TIMEZONE:-America/Caracas}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
    name: asistente_citas_postgres_data
  redis_data:
    name: asistente_citas_redis_data

